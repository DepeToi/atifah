# atifah-gateway 独立部署。前置条件：
#   1. 仓库根目录已执行 mvn clean package -DskipTests；
#   2. 中间件已通过 deploy/docker-compose/docker-compose.yml 启动（网络 atifah-net）；
#   3. Nacos 已发布网关私有配置（可选，缺失时使用本地默认值）。
#
# 构建并启动：docker compose -f atifah-gateway/docker-compose.yml up -d --build
# 查看日志：  docker compose -f atifah-gateway/docker-compose.yml logs -f
# 停止清理：  docker compose -f atifah-gateway/docker-compose.yml down
#
# 与 deploy/docker-compose/docker-compose.app.yml 复用同一份模块 Dockerfile；
# 镜像 tag、容器名、端口与统一编排一致，同一个服务不能同时用两种方式运行。
name: atifah-gateway

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-eclipse-temurin:21-jre-jammy}
    image: atifah/gateway:local
    container_name: atifah-gateway
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-1g}
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      NACOS_ADDR: ${NACOS_ADDR:-nacos:8848}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-atifah_dev}
      SENTINEL_DASHBOARD: ${SENTINEL_DASHBOARD:-sentinel-dashboard:8858}
      # 生产必须收敛为具体域名；默认 * 仅限本地开发
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      # 网关与 auth-service 必须使用同一 JWT 密钥；非开发环境通过环境变量注入，禁止写入本文件：
      # JWT_SECRET: ${JWT_SECRET:?未设置 JWT_SECRET}
    networks:
      - atifah-net

networks:
  atifah-net:
    external: true
