# 业务服务模板（以 user-service 为例；其余服务复制本文件改名字/端口即可）。
# 服务经 Nacos 注册，网关用 lb:// 直连 Pod IP；K8s Service 仅用于监控/未来直连。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: atifah-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: user-service
          image: atifah/user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: atifah-env
            - secretRef:
                name: atifah-secret
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: atifah-prod
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
