# Ingress-Nginx：集群统一入口，TLS/HTTP2 在此终止（生产配 cert-manager）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atifah-ingress
  namespace: atifah-prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # /ws/** 由网关转发 message-service，需放长超时
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: atifah.local # 本地测试域名（hosts 加 127.0.0.1 atifah.local）
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080
