# 网关：无状态多副本，Ingress 唯一入口（docs/architecture.md §8）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: atifah-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: gateway-service
          image: atifah/gateway-service:latest # 需先构建镜像（Jib/Dockerfile，见 README）
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: atifah-env
            - secretRef:
                name: atifah-secret
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: atifah-prod
spec:
  type: ClusterIP
  selector:
    app: gateway-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
