# 非敏感共享配置：中间件连接地址。
# 本地 Docker Desktop K8s 用 host.docker.internal 指向宿主机 docker-compose 起的中间件；
# 生产改为云托管/集群内地址（建议用 Kustomize overlay 覆盖，不直接改本文件）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: atifah-env
  namespace: atifah-prod
data:
  # 激活 prod profile：common-security 的 NacosNamespaceGuard 据此校验 namespace，
  # 缺失或仍为 dev/test 时拒绝启动。
  SPRING_PROFILES_ACTIVE: "prod"
  NACOS_ADDR: "host.docker.internal:8848"
  NACOS_NAMESPACE: "atifah_prod"
  MYSQL_HOST: "host.docker.internal"
  MYSQL_PORT: "3306"
  MYSQL_USER: "root"
  REDIS_HOST: "host.docker.internal"
  REDIS_PORT: "6379"
  ROCKETMQ_NAMESRV: "host.docker.internal:9876"
  SENTINEL_DASHBOARD: "host.docker.internal:8858"
  CORS_ALLOWED_ORIGINS: "*"
