name: atifah

services:
  mysql:
    image: mysql:8.0.39
    container_name: atifah-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - atifah-net

  redis:
    image: redis:7.4-alpine
    container_name: atifah-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - atifah-net

  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: atifah-nacos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MODE: standalone
      # 配置持久化到 MySQL（默认 Derby 内嵌存储，容器重建即丢失）
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: "3306"
      MYSQL_SERVICE_DB_NAME: nacos_config
      # 本地开发凭据，与 mysql 服务保持一致；生产必须独立账号并走环境变量注入
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root
      # MySQL 8 caching_sha2_password 需允许公钥获取；时区对齐容器默认值
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      # 关闭 2.x→3.x 命名空间兼容迁移（Nacos 3.0.3 预检 SQL 在 Derby CLOB 上触发 bad grammar，导致启动失败）；
      # 本地为全新 MySQL 库，无 2.x 遗留数据，无需迁移
      NACOS_CONFIG_NAMESPACE_COMPATIBLE_MODE: "false"
      NACOS_AUTH_ENABLE: "false"
      # Nacos 3.x 启动脚本强制校验：必须提供 base64 且解码后 >=32 字节的 token（本地开发值）
      NACOS_AUTH_TOKEN: "${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN 未设置，见 deploy/docker-compose/.env.example}"
      NACOS_AUTH_IDENTITY_KEY: "atifah-server-identity"
      NACOS_AUTH_IDENTITY_VALUE: "atifah-server-identity-value"
      # 本地开发：关闭 Nacos 3 运维 API 鉴权，便于脚本导入配置（生产必须开启）
      NACOS_AUTH_ADMIN_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
      # Nacos 3.x 控制台端口，宿主机使用 8849 避免与网关 8080 冲突
      - "8849:8080"
    networks:
      - atifah-net

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: atifah-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m -Xmn128m"
    ports:
      - "9876:9876"
    networks:
      - atifah-net

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: atifah-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    command: sh mqbroker -c /home/rocketmq/broker.conf

    # 以 root 运行可绕过命名卷由 root 创建导致的写权限问题（本地开发）。
    # 注意：root 的 user.home 为 /root，broker 的 storePathRootDir 默认落在
    # /root/store，因此下方卷必须挂到 /root/store，挂到 /home/rocketmq/store 无效。
    user: "0:0"
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx1g -Xmn256m"
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - rocketmq-store:/root/store
    networks:
      - atifah-net

  # RocketMQ 管理界面（可选）：docker compose --profile ops up -d rocketmq-dashboard
  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:1.0.0
    container_name: atifah-rocketmq-dashboard
    profiles: [ "ops" ]
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false"
    ports:
      - "8180:8080"
    networks:
      - atifah-net

  # Sentinel 控制台（可选）：docker compose --profile ops up -d sentinel-dashboard
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: atifah-sentinel-dashboard
    profiles: [ "ops" ]
    restart: unless-stopped
    ports:
      - "8858:8858"
    networks:
      - atifah-net

  # 需要验证分布式事务时启用：docker compose --profile seata up -d
  seata-server:
    image: seataio/seata-server:2.5.0
    container_name: atifah-seata-server
    profiles: [ "seata" ]
    restart: unless-stopped
    environment:
      STORE_MODE: file
    ports:
      - "8091:8091"
      - "7091:7091"
    networks:
      - atifah-net

  # 本地静态托管验证（可选）：docker compose --profile nginx up -d nginx
  nginx:
    image: nginx:1.27-alpine
    profiles: [ "nginx" ]
    container_name: atifah-nginx
    restart: unless-stopped
    # Linux 上 host.docker.internal 默认不可解析；nginx 加载配置时即解析 upstream，
    # 缺失会直接 [emerg] 退出，因此必须显式映射到宿主机网关
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../atifah-admin-web/frontend/dist:/usr/share/nginx/html:ro
    networks:
      - atifah-net

volumes:
  mysql-data:
  redis-data:
  rocketmq-store:

networks:
  # 固定网络名，供 docker-compose.app.yml（方案 B）以 external 方式接入
  atifah-net:
    name: atifah-net
    driver: bridge
