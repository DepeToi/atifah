name: atifah

services:
  mysql:
    image: mysql:8.0.39
    container_name: atifah-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - atifah-net

  redis:
    image: redis:7.4-alpine
    container_name: atifah-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - atifah-net

  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: atifah-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      # Nacos 3.x 启动脚本强制校验：必须提供 base64 且解码后 >=32 字节的 token（本地开发值）
      NACOS_AUTH_TOKEN: "${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN 未设置，见 deploy/docker-compose/.env.example}"
      NACOS_AUTH_IDENTITY_KEY: "atifah-server-identity"
      NACOS_AUTH_IDENTITY_VALUE: "atifah-server-identity-value"
      # 本地开发：关闭 Nacos 3 运维 API 鉴权，便于脚本导入配置（生产必须开启）
      NACOS_AUTH_ADMIN_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
      # Nacos 3.x 控制台端口，宿主机使用 8849 避免与网关 8080 冲突
      - "8849:8080"
    networks:
      - atifah-net

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: atifah-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m -Xmn128m"
    ports:
      - "9876:9876"
    networks:
      - atifah-net

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: atifah-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    command: sh mqbroker -c /home/rocketmq/broker.conf
    # 命名卷由 root 创建，镜像内 broker 以 uid 3000 运行无法写入 store（本地开发）
    user: "0:0"
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx1g -Xmn256m"
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
    networks:
      - atifah-net

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:1.0.0
    container_name: atifah-rocketmq-dashboard
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false"
    ports:
      - "8180:8080"
    networks:
      - atifah-net

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: atifah-sentinel-dashboard
    restart: unless-stopped
    ports:
      - "8858:8858"
    networks:
      - atifah-net

  # 需要验证分布式事务时启用：docker compose --profile seata up -d
  seata-server:
    image: seataio/seata-server:2.5.0
    container_name: atifah-seata-server
    profiles: [ "seata" ]
    restart: unless-stopped
    environment:
      STORE_MODE: file
    ports:
      - "8091:8091"
      - "7091:7091"
    networks:
      - atifah-net

  # 本地验证管理后台生产静态托管（可选）：docker compose --profile nginx up -d nginx
  nginx:
    image: nginx:1.27-alpine
    profiles: [ "nginx" ]
    container_name: atifah-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../atifah-admin-web/frontend/dist:/usr/share/nginx/html:ro
    networks:
      - atifah-net

volumes:
  mysql-data:
  redis-data:
  rocketmq-store:

networks:
  atifah-net:
    driver: bridge
