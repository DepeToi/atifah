# 业务服务共享配置（Nacos data-id: common-application.yaml, group: atifah_GROUP）
# 由各服务通过 spring.config.import 引入。此处仅放各服务完全一致、且与连接 Nacos
# 本身无关的配置；连接 Nacos 所需的 spring.cloud.nacos.* 与差异化项
# （端口、应用名、数据源 URL、生产者组）保留在各服务本地 application.yml。

spring:
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: ${DB_POOL_TIMEOUT:3000}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      eager: false
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
  producer:
    send-message-timeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name:atifah}

atifah:
  security:
    jwt:
      secret: ${JWT_SECRET:atifah-dev-secret-change-me-please-32bytes}
      issuer: atifah
      access-token-ttl: 2h

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
