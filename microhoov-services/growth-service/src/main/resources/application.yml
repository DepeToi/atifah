server:
  port: 8088
  shutdown: graceful

spring:
  application:
    name: microhoov-growth
  config:
    import:
      - "optional:nacos:${spring.application.name}.yaml?group=MICROHOOV_GROUP&refreshEnabled=true"
      - "optional:nacos:common-application.yaml?group=MICROHOOV_GROUP&refreshEnabled=true"
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: MICROHOOV_GROUP
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: MICROHOOV_GROUP
        file-extension: yaml
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/microhoov_growth?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

rocketmq:
  producer:
    group: microhoov-growth-producer

# 本地骨架默认关闭 Seata，接入分布式事务时改为 true 并提供 seata-server 地址
seata:
  enabled: false
  application-id: ${spring.application.name}
  tx-service-group: microhoov-growth-tx-group

