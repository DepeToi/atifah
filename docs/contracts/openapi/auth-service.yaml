# ============================================================
# auth-service 接口契约（P0 纵向切片）
# 通用规则见 ../api-conventions.md；决策背景见 ../../adr/0003-auth-baseline.md。
# 冻结后由 Claude 维护，CodeBuddy 只读。
# ============================================================
openapi: 3.1.0

info:
  title: auth-service API
  version: 0.1.0
  description: |
    atifah auth-service 认证接口契约（v0.1）。

    - 基路径：`/api/v1/auth`，由网关转发到 `atifah-auth`。
    - 四个接口均在网关鉴权白名单（`/api/v1/auth/`）内，不依赖网关注入的 `X-User-Id`。
    - 登出通过请求体中的 Refresh Token 撤销会话，不校验 Access Token。
    - 统一响应 `Result<T>`，错误码见 `../api-conventions.md` §4。

servers:
  - url: http://localhost:8080
    description: 本地网关
  - url: https://api.example.com
    description: 生产网关（示例，按环境替换）

# 认证接口本身不需要 Bearer Token。
security: []

tags:
  - name: Auth
    description: 注册、登录、刷新与登出

paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: 手机号注册
      description: |
        创建认证账号并返回全局 `userId`，不返回令牌；客户端注册成功后需再调用登录接口。

        幂等：必须携带 `Idempotency-Key`；相同键的串行重复请求返回首次结果。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              example: {code: 0, message: OK, data: {userId: "1856000000000000001"}, timestamp: 1700000000000}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 手机号密码登录
      description: |
        校验手机号与密码，返回 Access Token 与 Refresh Token。

        - 同一手机号 10 分钟内连续失败 5 次后返回 `42900`，窗口结束自动解除；成功登录后计数清零。
        - 账号禁用仅在密码校验通过后返回 `40300`；凭据错误统一返回 `40100`，避免账号枚举。
        - 登录不要求 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              example:
                code: 0
                message: OK
                data:
                  userId: "1856000000000000001"
                  accessToken: "example-access-token"
                  refreshToken: "example-refresh-token"
                  tokenType: Bearer
                  expiresIn: 900
                  refreshExpiresIn: 604800
                timestamp: 1700000000000
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: 刷新令牌
      description: |
        使用 Refresh Token 换取新的 Access Token，并轮换 Refresh Token（旧令牌立即失效）。

        - 已过期、已撤销或格式非法的 Refresh Token 返回 `40100`。
        - 并发刷新同一令牌时只有一个请求成功；已撤销令牌在 30 秒宽限期内再次使用只返回 `40100`。
        - 超过宽限期再次使用已撤销令牌，视为泄露：撤销该用户全部有效 Refresh Token 后返回 `40100`。
        - 刷新不要求 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 刷新成功，返回轮换后的令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              example:
                code: 0
                message: OK
                data:
                  userId: "1856000000000000001"
                  accessToken: "example-access-token"
                  refreshToken: "example-refresh-token"
                  tokenType: Bearer
                  expiresIn: 900
                  refreshExpiresIn: 604800
                timestamp: 1700000000000
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 登出
      description: |
        撤销请求体中的 Refresh Token。令牌不存在、已过期或已撤销时仍返回成功（幂等）。

        Access Token 不立即失效，最长在剩余 TTL（≤15 分钟）后过期；登出不要求 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: 登出成功（包括令牌已失效的情况）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              example: {code: 0, message: OK, data: null, timestamp: 1700000000000}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 写接口必填，规范 UUID（8-4-4-4-12）；相同键的串行重复请求返回首次结果。
      schema: {type: string, format: uuid}

    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: 链路追踪 ID，网关生成/透传。
      schema: {type: string, maxLength: 64}

  responses:
    BadRequest:
      description: 参数错误（40000）：字段校验失败，或必需的 Idempotency-Key 缺失/格式非法。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Result'}
          example: {code: 40000, message: 请求参数错误, data: null, timestamp: 1700000000000}

    Unauthorized:
      description: 未认证或凭据无效（40100）：登录凭据错误、Refresh Token 无效/过期/已撤销。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Result'}
          example: {code: 40100, message: 未认证或凭据无效, data: null, timestamp: 1700000000000}

    Forbidden:
      description: 无访问权限（40300）：账号已被禁用（仅在密码校验通过后返回）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Result'}
          example: {code: 40300, message: 账号已禁用, data: null, timestamp: 1700000000000}

    Conflict:
      description: 数据冲突（40900）：手机号已注册。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Result'}
          example: {code: 40900, message: 手机号已注册, data: null, timestamp: 1700000000000}

    TooManyRequests:
      description: 请求过于频繁（42900）：登录失败次数超过阈值。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Result'}
          example: {code: 42900, message: 登录失败次数过多，请稍后再试, data: null, timestamp: 1700000000000}

    InternalError:
      description: 系统繁忙（50000）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Result'}
          example: {code: 50000, message: 系统繁忙，请稍后重试, data: null, timestamp: 1700000000000}

  schemas:
    RegisterRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          pattern: '^1[3-9][0-9]{9}$'
          example: "13800005678"
          description: 中国大陆手机号；接口与日志必须脱敏展示。
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          pattern: '^(?=.*[A-Za-z])(?=.*[0-9])[!-~]{8,64}$'
          description: 8–64 位可打印 ASCII 字符（不含空格），至少包含字母与数字。
          writeOnly: true

    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          pattern: '^1[3-9][0-9]{9}$'
          example: "13800005678"
          description: 中国大陆手机号；接口与日志必须脱敏展示。
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          description: 登录密码。
          writeOnly: true

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 43
          maxLength: 128
          description: 登录或刷新返回的不透明刷新令牌（Base64URL，256 位随机数）。
          writeOnly: true

    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 43
          maxLength: 128
          description: 待撤销的 Refresh Token。
          writeOnly: true

    RegisterResult:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          example: "1856000000000000001"
          description: 全局用户 ID（雪花 ID 字符串），后续登录与业务调用使用。

    AuthToken:
      type: object
      required: [userId, accessToken, refreshToken, tokenType, expiresIn, refreshExpiresIn]
      properties:
        userId:
          type: string
          example: "1856000000000000001"
          description: 全局用户 ID（雪花 ID 字符串）。
        accessToken:
          type: string
          description: "JWT Access Token，放入 `Authorization: Bearer <token>`。"
        refreshToken:
          type: string
          description: 不透明 Refresh Token；仅用于刷新与登出，服务端只存哈希。
        tokenType: {type: string, const: Bearer}
        expiresIn: {type: integer, description: Access Token 有效秒数。, example: 900}
        refreshExpiresIn: {type: integer, description: Refresh Token 有效秒数。, example: 604800}

    Result:
      type: object
      required: [code, message, timestamp]
      properties:
        code: {type: integer, description: 0 成功；非 0 取值见 ../api-conventions.md §4。, example: 0}
        message: {type: string, example: OK}
        data: {description: 成功时为 RegisterResult 或 AuthToken（见各接口示例），失败时为 null。}
        timestamp: {type: integer, format: int64, description: 服务端时间戳（毫秒）。}
