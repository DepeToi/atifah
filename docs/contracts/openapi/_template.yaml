# ============================================================
# OpenAPI 3.1 契约模板
# 复制为 docs/contracts/openapi/<service>.yaml 后填写；保留文件名中的 "_" 前缀表示模板。
# 通用规则见 ../api-conventions.md；冻结后由 Claude 维护，CodeBuddy 只读。
# ============================================================
openapi: 3.1.0

info:
  title: <service> API
  version: 0.1.0
  description: |
    atifah <service> 服务接口契约。
    基路径：C 端 /api/v1，管理端 /admin/api（由网关统一入口）。
    统一响应：Result<T> / PageResult<T>。

servers:
  - url: http://localhost:8080
    description: 本地网关
  - url: https://api.example.com
    description: 生产网关（示例，按环境替换）

security:
  - bearerAuth: []

# 按服务填写；没有接口时保留空对象，便于 CI/工具解析。
paths: {}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 写接口必填，规范 UUID（8-4-4-4-12）；相同键的串行重复请求返回首次结果。
      schema:
        type: string
        format: uuid

    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: 链路追踪 ID，网关生成/透传。
      schema:
        type: string
        maxLength: 64

    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始。
      schema:
        type: integer
        minimum: 1
        default: 1

    Size:
      name: size
      in: query
      required: false
      description: 每页条数，默认 20，上限 100。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    Result:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: integer
          description: 0 成功；非 0 见错误码表。
          example: 0
        message:
          type: string
          example: OK
        data:
          description: 业务数据，可为 null。
        timestamp:
          type: integer
          format: int64
          description: 服务端时间戳（毫秒）。

    PageResult:
      type: object
      required: [records, total, page, size]
      properties:
        records:
          type: array
          items: {}
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int64
          minimum: 1
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 100

    ErrorCode:
      type: integer
      description: |
        0 成功；40000 参数错误；40100 未认证；40300 无权限；
        40400 资源不存在；40500 方法不支持；40900 冲突；
        42900 限流；50000 系统繁忙。
      example: 0
