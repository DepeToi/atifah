server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: atifah-auth
  config:
    import:
      - "nacos:common-application.yaml?group=ATIFAH_PUBLIC_GROUP&refreshEnabled=true"
      - "optional:nacos:${spring.application.name}.yaml?group=ATIFAH_AUTH_GROUP&refreshEnabled=true"
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:atifah_dev}
        group: atifah_GROUP
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:atifah_dev}
        group: ATIFAH_AUTH_GROUP
        file-extension: yaml
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/atifah_auth?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

rocketmq:
  producer:
    group: atifah-auth-producer

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

atifah:
  auth:
    refresh-token-ttl: 7d
    max-login-failures: 5
    login-failure-window: 10m
