server:
  port: 8087
  shutdown: graceful

spring:
  application:
    name: atifah-message
  config:
    import:
      - "optional:nacos:${spring.application.name}.yaml?group=atifah_GROUP&refreshEnabled=true"
      - "optional:nacos:common-application.yaml?group=atifah_GROUP&refreshEnabled=true"
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: atifah_GROUP
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: atifah_GROUP
        file-extension: yaml
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/atifah_message?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

rocketmq:
  producer:
    group: atifah-message-producer
